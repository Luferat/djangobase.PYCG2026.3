{% extends 'cadastro/base.html' %}

{% block titulo %}Cadastro - Detalhes de {{ pessoa.nome }}{% endblock %}

{% block conteudo %}
<article>
    <h2>Detalhes de {{ pessoa.nome }}</h2>
    <ul>
        <li><strong>ID:</strong> {{ pessoa.id }}</li>
        <li><strong>Email:</strong> {{ pessoa.email }}</li>
        <li><strong>Idade:</strong> {{ pessoa.idade }} anos</li>
    </ul>
    <a href="{% url 'editar' id=pessoa.id %}">Editar</a> |
    <a href="{% url 'deletar' id=pessoa.id %}">Apagar</a> |
    <a href="{% url 'index' %}">Voltar</a>
</article>
{% endblock %}
