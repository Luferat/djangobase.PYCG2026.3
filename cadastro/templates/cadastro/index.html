{% extends 'cadastro/base.html' %}

{% block titulo %}Cadastro{% endblock%}

{% block conteudo %}

<section>
    <h1>Olá, {{ nome | upper }}!</h1>
    <p>Você tem {{ idade }} anos.</p>
    <h3>Minhas frutas:</h3>
    <ul>
        {% for fruta in frutas %}
        <li>{{ fruta }}</li>
        {% endfor %}
    </ul>
</section>

{% endblock %}
